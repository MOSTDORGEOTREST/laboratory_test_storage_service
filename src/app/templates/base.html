<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#111826" />
    <meta name="LTS" content="Laboratory tests storage" />

    <link rel="icon" type="image/svg+xml" href="/static/images/gx-emblem.svg" />
    <link rel="apple-touch-icon" href="/static/images/page.png" />

    <title>MDGT · LTS — Хранилище лабораторных испытаний</title>

    <meta
      name="description"
      content="Сервис для хранения результатов лабораторных испытаний грунтов."
    />

    <link rel="preload" href="/static/css/fonts/unbounded-cyrillic-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/static/css/fonts/inter-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" type="text/css" href="/static/css/style.css" />
  </head>
  <body id="body">
    {% block header %}{% endblock %}
    <main>{% block content %}{% endblock %}</main>

    <footer class="footer no-print">
      <div class="wrap footer__inner">
        <span class="footer__copy">© МОСТДОРГЕОТРЕСТ · Лабораторная база</span>
        <a class="dev-link" href="http://mdgt.ru" target="_blank" rel="noopener" aria-label="Разработчик — МОСТДОРГЕОТРЕСТ, mdgt.ru">
          <span class="dev-link__chip"><img src="/static/images/mdgt.png" alt="МОСТДОРГЕОТРЕСТ" /></span>
          <span>Разработка · МОСТДОРГЕОТРЕСТ · mdgt.ru</span>
        </a>
        <span class="footer__slogan">soil · test · store</span>
      </div>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="/static/js/requests.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
