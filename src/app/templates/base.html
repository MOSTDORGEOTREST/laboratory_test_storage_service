<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="LTS" content="Laboratory tests storage" />

    <link rel="icon" href="/static/images/page.png" />
    <link rel="apple-touch-icon" href="/static/images/page.png" />

    <title>LTS — Лабораторные испытания</title>

    <meta
      name="description"
      content="Сервис для хранения результатов лабораторных испытаний грунтов."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" type="text/css" href="/static/css/style.css" />
  </head>
  <body class="body" id="body">
    <div class="wrapper">
      {% block header %}{% endblock %}
      <main class="container">{% block content %}{% endblock %}</main>
    </div>

    <script src="/static/js/requests.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
